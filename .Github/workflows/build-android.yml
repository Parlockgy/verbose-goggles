
name: Build Size Mayhem for Android

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Geode mod for Android 64-bit
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: ./

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Size-Mayhem-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
